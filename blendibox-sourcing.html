<title>Blendibox Sourcing China</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: app de sourcing com nav lateral (topo no mobile), paineis por aba.
     Estetica "puffer": tiles macios e acolchoados, cantos arredondados, acento tangerina. */
  :root{
    --bg:#f4f2ee; --panel:#ffffff; --panel-2:#faf8f4; --ink:#1d2024; --ink-soft:#565c66;
    --line:#e4e0d8; --line-strong:#d2ccc0;
    --accent:#ff5a2c; --accent-ink:#b23a16; --accent-soft:#ffe9df;
    --teal:#0f8a7e; --teal-soft:#dcf1ee;
    --ok:#15803d; --ok-soft:#dcf5e5; --warn:#b45309; --warn-soft:#fdeccd;
    --bad:#c0392b; --bad-soft:#fbe3df; --gray:#6b7280; --gray-soft:#edeef0;
    --shadow:0 1px 2px rgba(20,22,26,.05),0 6px 18px rgba(20,22,26,.06);
    --shadow-lg:0 10px 40px rgba(20,22,26,.12);
    --r:16px; --r-sm:10px;
    --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
    --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --maxw:1180px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1e2125; --panel-2:#23272c; --ink:#f0f1f3; --ink-soft:#a3abb6;
    --line:#2d3137; --line-strong:#3a3f46;
    --accent:#ff6b42; --accent-ink:#ff9676; --accent-soft:#3a241c;
    --teal:#2bb5a6; --teal-soft:#15312e;
    --ok:#4ade80; --ok-soft:#163023; --warn:#fbbf24; --warn-soft:#3a2d12;
    --bad:#f87171; --bad-soft:#3a1f1d; --gray:#9aa1ac; --gray-soft:#282c31;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15171a; --panel:#1e2125; --panel-2:#23272c; --ink:#f0f1f3; --ink-soft:#a3abb6;
    --line:#2d3137; --line-strong:#3a3f46;
    --accent:#ff6b42; --accent-ink:#ff9676; --accent-soft:#3a241c;
    --teal:#2bb5a6; --teal-soft:#15312e;
    --ok:#4ade80; --ok-soft:#163023; --warn:#fbbf24; --warn-soft:#3a2d12;
    --bad:#f87171; --bad-soft:#3a1f1d; --gray:#9aa1ac; --gray-soft:#282c31;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
  p{margin:0}
  a{color:var(--accent-ink)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mono{font-variant-numeric:tabular-nums}

  /* top bar */
  header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
  .bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--accent),#ff8a4c);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .logo::before,.logo::after{content:"";position:absolute;inset:7px;border-radius:7px;border:2px solid rgba(255,255,255,.85)}
  .logo::after{inset:13px;border-width:0;background:rgba(255,255,255,.9);border-radius:3px}
  .brand h1{font-size:17px;line-height:1.1}
  .brand .sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
  .theme-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
  .theme-btn:hover{border-color:var(--line-strong)}

  /* nav */
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
  nav.tabs button{flex:none;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:var(--ink-soft);
    font-family:var(--f-display);font-size:13.5px;font-weight:500;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  nav.tabs button:hover{background:var(--panel-2);color:var(--ink)}
  nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  nav.tabs .ic{font-size:14px}

  main{padding-block:24px 56px}
  .panel-view{display:flex;flex-direction:column;gap:20px}
  .lead{max-width:62ch}
  .lead .eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
  .lead h2{font-size:26px;margin-top:5px}
  .lead p{color:var(--ink-soft);margin-top:9px}

  /* cards & grid */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:820px){.g-3,.g-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g-2,.g-3,.g-4{grid-template-columns:1fr}}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;font-family:var(--f-display);letter-spacing:.02em}
  .pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
  .pill.teal{background:var(--teal-soft);color:var(--teal)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.gray{background:var(--gray-soft);color:var(--gray)}

  /* overview stat tiles */
  .stat{padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
  .stat .n{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
  .stat .l{font-size:12.5px;color:var(--ink-soft);margin-top:7px}
  .pillars{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
  @media(max-width:720px){.pillars{grid-template-columns:1fr}}
  .pillar{padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2)}
  .pillar .k{font-size:22px}
  .pillar h4{font-size:15px;margin:9px 0 6px}
  .pillar p{font-size:13px;color:var(--ink-soft)}

  /* hub cards */
  .hub{display:flex;flex-direction:column;gap:12px;padding:18px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
  .hub:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
  .hub .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .hub h3{font-size:17px}
  .hub .loc{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .hub .cn{font-size:12px;color:var(--ink-soft)}
  .fit{display:flex;align-items:center;gap:3px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
  .dot.on{background:var(--accent)}
  .hub .spec{font-size:13px;color:var(--ink-soft)}
  .hub .tags{display:flex;flex-wrap:wrap;gap:5px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input,textarea{font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  label.fld span{font-family:var(--f-display)}

  /* detail drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .drawer-bg.open{display:flex}
  .drawer{background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);
    padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  @media(min-width:640px){.drawer-bg{align-items:center}.drawer{border-radius:20px}}
  .drawer h3{font-size:21px}
  .drawer .close{float:right;background:var(--gray-soft);border:none;color:var(--ink);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:17px}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13.5px;margin-top:4px}
  .kv dt{color:var(--ink-soft);font-weight:600}
  .kv dd{margin:0}
  @media(max-width:480px){.kv{grid-template-columns:1fr}.kv dt{margin-top:8px}}

  /* buttons */
  .btn{font-family:var(--f-display);font-weight:600;font-size:14px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,90,44,.3)}
  .btn.primary:hover{filter:brightness(.96)}
  .btn.ghost{background:var(--panel);border-color:var(--line-strong);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink-soft)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* supplier tracker */
  .sup-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .sup-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .sup{padding:16px;display:flex;flex-direction:column;gap:11px}
  .sup .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .sup h4{font-size:15.5px}
  .sup .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .sup .scorebar{display:flex;gap:4px;align-items:center}
  .score-pill{font-family:var(--f-display);font-weight:700;font-size:15px;padding:2px 9px;border-radius:8px}
  .sup .vals{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px}
  .sup .vals b{font-family:var(--f-display)}
  .sup .acts{display:flex;gap:6px;margin-top:2px}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .stars{display:inline-flex;gap:2px;cursor:pointer}
  .stars span{font-size:18px;color:var(--line-strong);cursor:pointer}
  .stars span.on{color:var(--accent)}
  .banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:13px;background:var(--teal-soft);color:var(--teal);border:1px solid transparent}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}

  /* modal form */
  .modal-bg{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;border:1px solid var(--line)}
  .modal h3{font-size:19px;margin-bottom:14px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr}}
  .form-grid .full{grid-column:1/-1}
  textarea{resize:vertical;min-height:62px;width:100%}
  input,select{width:100%}

  /* calculator */
  .calc{display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media(max-width:860px){.calc{grid-template-columns:1fr}}
  .calc-inputs{display:flex;flex-direction:column;gap:12px}
  .inrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .result-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .rtile{padding:14px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
  .rtile .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .rtile .v{font-family:var(--f-display);font-size:22px;font-weight:600;margin-top:4px}
  .rtile.hero{background:var(--ink);color:var(--bg);border-color:var(--ink);grid-column:1/-1}
  .rtile.hero .l{color:rgba(255,255,255,.7)}
  .taxtable{width:100%;border-collapse:collapse;font-size:13.5px}
  .taxtable td,.taxtable th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  .taxtable th{font-family:var(--f-display);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
  .taxtable td:last-child,.taxtable th:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar-wrap{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 72px;gap:10px;align-items:center;font-size:12.5px}
  .bar-track{height:10px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px}

  /* steps timeline */
  .phase{display:flex;flex-direction:column;gap:12px}
  .phase-h{display:flex;align-items:center;gap:10px}
  .phase-n{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--accent);color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
  .phase-h h3{font-size:17px}
  .step{display:flex;gap:13px;padding:15px 16px}
  .step .num{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent-ink);background:var(--accent-soft);min-width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .step h4{font-size:14.5px}
  .step .b{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .step .risk{font-size:12.5px;margin-top:8px;padding:8px 11px;border-radius:9px;background:var(--bad-soft);color:var(--bad);display:flex;gap:7px}
  .channels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:620px){.channels{grid-template-columns:repeat(2,1fr)}}
  .chan{padding:13px;border-radius:12px;border:1px solid var(--line);text-align:center}
  .chan .sq{font-size:22px}
  .chan h5{font-family:var(--f-display);font-size:13px;margin:6px 0 4px}
  .chan p{font-size:11.5px;color:var(--ink-soft)}

  /* checklist + templates */
  .check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .check:last-child{border-bottom:none}
  .check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
  .tmpl{position:relative}
  .tmpl pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0 0;color:var(--ink)}
  .copy{position:absolute;top:8px;right:8px}
  details.src{margin-top:4px}
  details.src summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600}
  details.src ul{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--ink-soft)}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);line-height:1.6}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* glossário: termos marcados no texto + tooltip flutuante */
  .term{border-bottom:1px dashed var(--accent-ink);cursor:help;text-decoration:none;color:inherit}
  .term:hover,.term.active{background:var(--accent-soft)}
  #tip{position:fixed;z-index:80;max-width:300px;background:var(--ink);color:var(--bg);
    padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-lg);
    pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;visibility:hidden}
  #tip.show{opacity:1;transform:translateY(0);visibility:visible}
  #tip b{font-family:var(--f-display);display:block;margin-bottom:3px;color:var(--accent-ink);filter:brightness(1.25)}
  .gloss-search{width:100%;max-width:360px}
  .gloss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:620px){.gloss-grid{grid-template-columns:1fr}}
  .gterm{padding:14px 16px}
  .gterm .ab{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent-ink)}
  .gterm .fn{font-size:12px;color:var(--ink-soft);margin:2px 0 7px;font-style:italic}
  .gterm .df{font-size:13px;color:var(--ink)}
  .gcat{grid-column:1/-1;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
</style>

<header class="app">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Blendibox Sourcing · China</h1>
          <div class="sub">Bolsas puffer · fornecedores &amp; importação</div>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema claro/escuro">◐</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="views"></div>
  <div class="foot" id="foot"></div>
</main>

<!-- drawer de detalhe do polo -->
<div class="drawer-bg" id="hubDrawer"><div class="drawer" id="hubDrawerBody" role="dialog" aria-modal="true"></div></div>
<!-- modal de fornecedor -->
<div class="modal-bg" id="supModal"><div class="modal" id="supModalBody" role="dialog" aria-modal="true"></div></div>
<!-- tooltip de glossário -->
<div id="tip" role="tooltip"></div>

<script>
/* ============================================================
   DADOS — POLOS / CIDADES DA CHINA PARA BOLSAS (foco puffer)
   fit = aderência a bolsas puffer/acolchoadas (1-5)
   ============================================================ */
const HUBS = [
  {id:"baigou", name:"Baigou", cn:"白沟", prov:"Hebei (Baoding)", fit:5,

  {id:"shiling", name:"Guangzhou · Shiling", cn:"狮岭 / 白云", prov:"Guangdong", fit:4,
   spec:"\"Capital do couro e das bolsas\" (Huadu/Shiling) + mercados de Baiyun. Moda, acabamento melhor, forte em OEM/ODM e exportação.",
   price:"$$ — médio", quality:"Médio a alto", moq:"Médio (300–1000)", export:"Alto (export-ready)",
   bestFor:"Puffer fashion com acabamento premium e marca própria.",
   reach:"Mercados Sanyuanli / Shijing (Baiyun) e fábricas em Shiling. Base ideal durante a Canton Fair.",
   tags:["Moda","OEM/ODM","Export-ready","Acabamento"]},
  {id:"quanzhou", name:"Quanzhou · Jinjiang", cn:"泉州 / 晋江", prov:"Fujian", fit:5,
   spec:"Polo de bolsas esportivas e técnicas em nylon/poliéster, no ecossistema de sportswear (Anta, 361°). Forte em tecidos técnicos e matelassê.",
   price:"$$ — médio", quality:"Médio a alto", moq:"Médio (500–1000)", export:"Alto",
   bestFor:"Puffer técnico/esportivo, tecidos impermeáveis, costura matelassê de qualidade.",
   reach:"Via Alibaba/Made-in-China filtrando Fujian; feiras de calçados/têxteis de Jinjiang.",
   tags:["Nylon técnico","Matelassê","Esportivo","Impermeável"]},
  {id:"pinghu", name:"Pinghu", cn:"平湖", prov:"Zhejiang (Jiaxing)", fit:5,

/* ===== glossário: auto-marcação + tooltip ===== */
const AUTO_KEYS = GLOSSARY.map(g=>g.t).filter(k=>/^[A-Za-zÀ-ÿ]{2,9}$/.test(k)).sort((a,b)=>b.length-a.length);
const GLOSS_RE = new RegExp('\\b(' + AUTO_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')\\b');
const SKIP_TAGS = {SCRIPT:1,STYLE:1,PRE:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1,BUTTON:1,A:1};
function applyGlossary(root){
  if(!root) return;
  const seen = {}; // marca cada sigla no máximo 1x por bloco-pai para não poluir
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p=n.parentNode;
      while(p && p!==root){
        if(p.nodeType===1){
          if(SKIP_TAGS[p.tagName]) return NodeFilter.FILTER_REJECT;
          if(p.classList && (p.classList.contains('term')||p.classList.contains('no-gloss'))) return NodeFilter.FILTER_REJECT;
        }
        p=p.parentNode;
      }
      return GLOSS_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const targets=[]; let cur;
  while((cur=walker.nextNode())) targets.push(cur);
  const re = new RegExp(GLOSS_RE.source,'g');
  targets.forEach(node=>{
    const txt=node.nodeValue; re.lastIndex=0;
    let m, last=0; const frag=document.createDocumentFragment(); let any=false;
    while((m=re.exec(txt))){
      const key=m[1];
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const span=document.createElement('span');
      span.className='term'; span.dataset.t=key; span.textContent=key; span.setAttribute('tabindex','0');
      frag.appendChild(span); last=m.index+key.length; any=true;
    }
    if(any){ frag.appendChild(document.createTextNode(txt.slice(last))); node.parentNode.replaceChild(frag,node); }
  });
}
/* tooltip flutuante */
const tipEl=$('#tip');
let tipActive=null;
function showTip(span){
  const g=GMAP[span.dataset.t]; if(!g) return;
  tipEl.innerHTML=`<b>${esc(g.t)} · ${esc(g.full)}</b>${esc(g.def)}`;
  tipEl.classList.add('show');
  const r=span.getBoundingClientRect();
  const tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=r.left + r.width/2 - tw/2;
  x=Math.max(8, Math.min(x, innerWidth-tw-8));
  let y=r.top - th - 8;
  if(y<8) y=r.bottom+8; // vira pra baixo se não couber em cima
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}
function hideTip(){ tipEl.classList.remove('show'); if(tipActive){tipActive.classList.remove('active');tipActive=null;} }
document.addEventListener('mouseover',e=>{ const s=e.target.closest&&e.target.closest('.term'); if(s) showTip(s); });
document.addEventListener('mouseout',e=>{ if(e.target.closest&&e.target.closest('.term')) hideTip(); });
document.addEventListener('focusin',e=>{ if(e.target.classList&&e.target.classList.contains('term')) showTip(e.target); });
document.addEventListener('focusout',e=>{ if(e.target.classList&&e.target.classList.contains('term')) hideTip(); });
// toque no mobile: alterna
document.addEventListener('click',e=>{
  const s=e.target.closest&&e.target.closest('.term');
  if(s){ if(tipActive===s){hideTip();} else {hideTip();tipActive=s;s.classList.add('active');showTip(s);} }
  else if(tipActive){ hideTip(); }
});
window.addEventListener('scroll',hideTip,true);

function drawHubs(grid){
  grid.innerHTML='';
  let list=HUBS.filter(h=>h.fit>=hubFilter.fit);
  const exportRank=h=>({"Muito alto":4,"Alto":3,"Médio":2}[h.export.split(" ")[0]]||1);
  if(hubFilter.sort==='fit') list.sort((a,b)=>b.fit-a.fit);
  if(hubFilter.sort==='price') list.sort((a,b)=>a.price.length-b.price.length);
  if(hubFilter.sort==='export') list.sort((a,b)=> (b.export.includes('Muito')?3:b.export.includes('Alto')?2:1) - (a.export.includes('Muito')?3:a.export.includes('Alto')?2:1));
  list.forEach(h=>{
    const c=el('div','card hub');
    const dots=Array.from({length:5},(_,i)=>`<span class="dot ${i<h.fit?'on':''}"></span>`).join('');
    c.innerHTML=`<div class="top"><div><h3>${h.name}</h3><div class="loc">${h.cn} · ${esc(h.prov)}</div></div>

/* ================= FORNECEDORES (db) ================= */
let suppliers=[]; let dbNS=null; let useLocal=false; let userCan=true;
const STATUSES=[["prospect","Prospect","gray"],["contatado","Contatado","teal"],["amostra","Amostra","warn"],["negociando","Negociando","warn"],["aprovado","Aprovado","ok"],["rejeitado","Rejeitado","bad"]];
const statusMeta=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];
function scoreOf(s){const q=s.sQuality||0,p=s.sPrice||0,c=s.sComm||0,r=s.sRel||0;const vals=[q,p,c,r].filter(x=>x>0);return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):0;}

async function initDB(){
  try{
    dbNS = window.claude && claude.use ? await claude.use('db') : null;
  }catch(e){ dbNS=null; }
  if(dbNS){
    try{
      dbNS.collection('suppliers').orderBy('createdAt','desc').onSnapshot(docs=>{
        suppliers = docs.map(d=> Object.assign({_id:d.id}, d.data?d.data():d));
        if(active==='suppliers'||active==='overview') render();
      }, err=>{ fallbackLocal(); });
    }catch(e){ fallbackLocal(); }
  } else {
    fallbackLocal();
  }
}
function fallbackLocal(){
  useLocal=true;
  try{ suppliers=JSON.parse(localStorage.getItem('bb_suppliers')||'[]'); }catch(e){ suppliers=[]; }
  if(active==='suppliers'||active==='overview') render();
}
function saveLocal(){ try{ localStorage.setItem('bb_suppliers',JSON.stringify(suppliers)); }catch(e){} }

async function upsertSupplier(data){
  if(dbNS && !useLocal){
    const id = data._id || ('s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
    const payload=Object.assign({},data); delete payload._id;
    if(!payload.createdAt) payload.createdAt=Date.now();
    try{ await dbNS.doc('suppliers/'+id).set(payload); return; }
    catch(e){ alert('Não foi possível salvar na nuvem (permissão de escrita). Verifique se você tem acesso de edição.'); return; }
  }
  // local
  if(data._id){ const i=suppliers.findIndex(s=>s._id===data._id); if(i>=0) suppliers[i]=data; }
  else { data._id='s_'+Date.now(); data.createdAt=Date.now(); suppliers.unshift(data); }
  saveLocal(); render();
}
async function deleteSupplier(id){
  if(dbNS && !useLocal){ try{ await dbNS.doc('suppliers/'+id).delete(); }catch(e){ alert('Sem permissão para excluir.'); } return; }
  suppliers=suppliers.filter(s=>s._id!==id); saveLocal(); render();
}

  const c=el('div','card sup');
  const sc=scoreOf(s); const sm=statusMeta(s.status);
  const scColor= sc>=4?'var(--ok)':sc>=3?'var(--warn)':sc>0?'var(--bad)':'var(--gray)';
  const scBg= sc>=4?'var(--ok-soft)':sc>=3?'var(--warn-soft)':sc>0?'var(--bad-soft)':'var(--gray-soft)';
  c.innerHTML=`<div class="r1">
      <div><h4>${esc(s.name||'(sem nome)')}</h4><div class="meta">${esc(s.hub||'—')} ${s.productType?'· '+esc(s.productType):''}</div></div>
      <span class="score-pill" style="color:${scColor};background:${scBg}">${sc?sc.toFixed(1):'—'}</span>
    </div>
    <div><span class="pill ${sm[2]}">${sm[1]}</span></div>
    <div class="vals">
      <div>MOQ <b>${esc(s.moq||'—')}</b></div>
      <div>FOB <b>${s.fob?('US$ '+s.fob):'—'}</b></div>
      <div>Lead time <b>${esc(s.lead||'—')}</b></div>
      <div>Amostra <b>${esc(s.sample||'—')}</b></div>
    </div>
    ${s.contact?`<div class="meta" style="word-break:break-all">📇 ${esc(s.contact)}</div>`:''}
    ${s.notes?`<div class="meta" style="color:var(--ink-soft)">📝 ${esc(s.notes)}</div>`:''}
    <div class="acts">
      <button class="btn ghost sm" data-ed>Editar</button>
      <button class="btn ghost sm" data-del title="Excluir">🗑</button>
    </div>`;
  c.querySelector('[data-ed]').onclick=()=>openSupModal(s);
  const delBtn=c.querySelector('[data-del]');
  let armed=false, t=null;
  delBtn.onclick=()=>{
    if(!armed){ armed=true; delBtn.textContent='Confirmar?'; delBtn.classList.add('primary'); delBtn.classList.remove('ghost');
      t=setTimeout(()=>{armed=false;delBtn.textContent='🗑';delBtn.classList.add('ghost');delBtn.classList.remove('primary');},3000); return; }
    clearTimeout(t); deleteSupplier(s._id);
  };
  return c;
}

/* ================= CALCULADORA ================= */
const CALC_DEF={fob:6.80,qty:1000,freight:1800,insurance:120,rate:5.40,ii:20,ipi:0,pis:2.10,cofins:9.65,icms:18,afrmm:8,siscomex:154.23,desp:2500,markup:2.8};
let calc=Object.assign({},CALC_DEF);
try{const sv=JSON.parse(localStorage.getItem('bb_calc')||'null'); if(sv) calc=Object.assign({},CALC_DEF,sv);}catch(e){}

VIEWS.calc=()=>{
  const w=el('div','panel-view');
  w.appendChild(lead("Viabilidade de importação","Quanto cada bolsa custa no seu armazém?",

  const grid=el('div','calc');
  const ins=el('div','calc-inputs card pad');
  const field=(id,lbl,suf)=>`<label class="fld"><span>${lbl}</span><input id="c_${id}" type="number" step="0.01" value="${calc[id]}">${suf?'':''}</label>`;
  ins.innerHTML=`
    <div style="font-family:var(--f-display);font-weight:600;font-size:13px">Mercadoria</div>
    <div class="inrow">${field('fob','FOB unit (US$)')}${field('qty','Quantidade')}</div>
    <div class="inrow">${field('freight','Frete intl total (US$)')}${field('insurance','Seguro (US$)')}</div>
    ${field('rate','Câmbio US$ → R$')}
    <div style="font-family:var(--f-display);font-weight:600;font-size:13px;margin-top:4px">Tributos (%)</div>
    <div class="inrow">${field('ii','II %')}${field('ipi','IPI %')}</div>
    <div class="inrow">${field('pis','PIS %')}${field('cofins','COFINS %')}</div>
    <div class="inrow">${field('icms','ICMS %')}${field('afrmm','AFRMM % (frete mar.)')}</div>
    <div style="font-family:var(--f-display);font-weight:600;font-size:13px;margin-top:4px">Despesas (R$)</div>
    <div class="inrow">${field('siscomex','Taxa Siscomex')}${field('desp','Despachante/outras')}</div>
    <div style="font-family:var(--f-display);font-weight:600;font-size:13px;margin-top:4px">Venda</div>
    ${field('markup','Markup sobre custo (x)')}
    <button class="btn ghost sm" id="c_reset" style="margin-top:6px">↺ Restaurar padrões</button>`;
  grid.appendChild(ins);

  const out=el('div','card pad'); out.id='calcOut'; grid.appendChild(out);
  w.appendChild(grid);

  w.appendChild(el('div','banner','<span>ℹ️</span><span>Valores padrão são estimativas para bolsas (NCM família 4202). As alíquotas reais dependem da NCM exata, do estado (ICMS) e de regimes especiais. Confirme com seu despachante antes de fechar o pedido. O AFRMM (8%) incide sobre o frete marítimo; zere-o em importação aérea.</span>'));

  ins.querySelectorAll('input').forEach(i=>i.oninput=()=>{
    const k=i.id.slice(2); calc[k]= i.value===''?0:(+i.value);
    try{localStorage.setItem('bb_calc',JSON.stringify(calc));}catch(e){}
    drawCalc(out);
  });
  ins.querySelector('#c_reset').onclick=()=>{calc=Object.assign({},CALC_DEF);try{localStorage.removeItem('bb_calc');}catch(e){}go('calc');};
  drawCalc(out);
  return w;
};
function computeCalc(c){
  const fobTotalUSD=(c.fob||0)*(c.qty||0);
  const freightBRL=(c.freight||0)*(c.rate||0);
  const va=(fobTotalUSD+(c.freight||0)+(c.insurance||0))*(c.rate||0); // valor aduaneiro CIF em R$
  const ii=va*(c.ii||0)/100;
  const ipi=(va+ii)*(c.ipi||0)/100;
  const pis=va*(c.pis||0)/100;
  const cofins=va*(c.cofins||0)/100;
  const afrmm=freightBRL*(c.afrmm||0)/100;
  const despBase=(c.siscomex||0)+(c.desp||0)+afrmm; // despesas aduaneiras que entram na base do ICMS
  const icmsRate=(c.icms||0)/100;
  const icmsBase= icmsRate<1 ? (va+ii+ipi+pis+cofins+despBase)/(1-icmsRate) : 0;
  const icms=icmsBase*icmsRate;
  const totalTrib=ii+ipi+pis+cofins+icms;
  const totalDesp=(c.siscomex||0)+(c.desp||0)+afrmm;
  const landed=va+totalTrib+totalDesp;
  const perUnit=(c.qty? landed/c.qty:0);
  const retail=perUnit*(c.markup||0);
  return {fobTotalUSD,va,ii,ipi,pis,cofins,afrmm,icms,icmsBase,totalTrib,totalDesp,landed,perUnit,retail,
    fobUnitBRL:(c.fob||0)*(c.rate||0)};
}
function drawCalc(out){
  const c=calc, r=computeCalc(c);
  const tiles=`<div class="result-tiles">
    <div class="rtile hero"><div class="l">Custo landed por bolsa</div><div class="v">${money(r.perUnit)}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:4px">de ${money(r.fobUnitBRL)} FOB → <b>${r.fobUnitBRL? (r.perUnit/r.fobUnitBRL).toFixed(2):'—'}×</b> o preço de fábrica</div></div>
    <div class="rtile"><div class="l">Custo total do lote</div><div class="v">${money(r.landed)}</div></div>
    <div class="rtile"><div class="l">Tributos no total</div><div class="v">${money(r.totalTrib)}</div></div>
    <div class="rtile"><div class="l">Valor aduaneiro (CIF)</div><div class="v">${money(r.va)}</div></div>
    <div class="rtile"><div class="l">Preço sugerido (${(c.markup||0)}×)</div><div class="v" style="color:var(--teal)">${money(r.retail)}</div></div>
  </div>`;
  const rows=[["Imposto de Importação (II)",r.ii,"var(--accent)"],["IPI",r.ipi,"#f59e0b"],
    ["PIS-Importação",r.pis,"#8b5cf6"],["COFINS-Importação",r.cofins,"#0ea5e9"],
    ["ICMS",r.icms,"var(--teal)"],["AFRMM",r.afrmm,"#64748b"],["Siscomex + despesas",(c.siscomex||0)+(c.desp||0),"#94a3b8"]];
  const maxv=Math.max(...rows.map(x=>x[1]),1);
  const bars=`<div class="bar-wrap">${rows.map(([l,v,col])=>`
     <div class="bar-row"><div>${l}</div>
       <div class="bar-track"><div class="bar-fill" style="width:${(v/maxv*100).toFixed(1)}%;background:${col}"></div></div>
       <div class="mono" style="text-align:right">${money(v)}</div></div>`).join('')}</div>`;
  const table=`<table class="taxtable"><thead><tr><th>Componente</th><th>Valor (R$)</th></tr></thead><tbody>
    <tr><td>Valor aduaneiro (CIF)</td><td class="mono">${money(r.va)}</td></tr>
    <tr><td>+ II (${c.ii}%)</td><td class="mono">${money(r.ii)}</td></tr>
    <tr><td>+ IPI (${c.ipi}%)</td><td class="mono">${money(r.ipi)}</td></tr>
    <tr><td>+ PIS (${c.pis}%)</td><td class="mono">${money(r.pis)}</td></tr>
    <tr><td>+ COFINS (${c.cofins}%)</td><td class="mono">${money(r.cofins)}</td></tr>
    <tr><td>+ ICMS (${c.icms}% por dentro)</td><td class="mono">${money(r.icms)}</td></tr>
    <tr><td>+ AFRMM + Siscomex + despesas</td><td class="mono">${money(r.totalDesp)}</td></tr>
    <tr style="font-weight:700"><td>= Custo landed total</td><td class="mono">${money(r.landed)}</td></tr>
  </tbody></table>`;
  out.innerHTML=`<h3 style="font-size:16px;margin-bottom:12px">Resultado</h3>${tiles}
    <h4 style="font-size:14px;margin:18px 0 2px">Composição dos tributos</h4>${bars}
    <h4 style="font-size:14px;margin:18px 0 6px">Detalhamento</h4><div style="overflow-x:auto">${table}</div>`;
  applyGlossary(out);
}

   ["🧾","NCM correta","A classificação define imposto e licença. Bolsas ficam na família 4202; confirme o subitem exato."]].forEach(([k,h,t])=>{

  });
  w.appendChild(reg);

  // checklist
  const ck=el('div','card pad');
  ck.innerHTML=`<h3 style="font-size:16px;margin-bottom:6px">Checklist de due diligence do fornecedor</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:6px">Marque conforme avança. Fica salvo neste navegador.</p>`;
  let checks={}; try{checks=JSON.parse(localStorage.getItem('bb_dd')||'{}');}catch(e){}
  DD.forEach((t,i)=>{
    const row=el('label','check');
    row.innerHTML=`<input type="checkbox" ${checks['d'+i]?'checked':''}><span>${esc(t)}</span>`;
    row.querySelector('input').onchange=e=>{checks['d'+i]=e.target.checked;try{localStorage.setItem('bb_dd',JSON.stringify(checks));}catch(x){}};
    ck.appendChild(row);
  });
  w.appendChild(ck);

  // templates
  const tp=el('div','card pad');
  tp.innerHTML=`<h3 style="font-size:16px;margin-bottom:4px">Modelos de mensagem</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">Copie e ajuste os campos [entre colchetes].</p>`;
  TEMPLATES.forEach(t=>{
    const box=el('div','tmpl');
    box.innerHTML=`<h4 style="font-size:14px">${esc(t.title)}</h4><button class="btn ghost sm copy">Copiar</button><pre>${esc(t.body)}</pre>`;
    const btn=box.querySelector('.copy');
    btn.onclick=()=>{
      const txt=t.body;
      const done=()=>{btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent='Copiar',1500);};
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(()=>{selectText(box.querySelector('pre'));});
      } else selectText(box.querySelector('pre'));
    };
    tp.appendChild(box);
  });
  w.appendChild(tp);
  return w;
};
function selectText(node){const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);}

/* ================= GLOSSÁRIO ================= */
let glossQ='';
VIEWS.glossary=()=>{
  const w=el('div','panel-view');
  w.appendChild(lead("Dicionário do comércio exterior","Glossário das siglas e termos",
    "As siglas que mais aparecem no sourcing e na importação. No restante do sistema, elas ficam sublinhadas — passe o mouse (ou toque) para ver o significado na hora."));

  const bar=el('div','card pad');
  bar.innerHTML=`<label class="fld"><span>Buscar termo</span><input class="gloss-search" id="gQ" placeholder="ex.: NCM, FOB, ICMS, demurrage..." value="${esc(glossQ)}"></label>`;
  w.appendChild(bar);

  const grid=el('div','gloss-grid no-gloss'); grid.id='gGrid'; w.appendChild(grid);
  drawGloss(grid);
  const inp=bar.querySelector('#gQ');
  inp.oninput=e=>{glossQ=e.target.value;drawGloss(grid);};
  setTimeout(()=>{ if(glossQ){inp.focus();inp.setSelectionRange(glossQ.length,glossQ.length);} },0);
  return w;
};
function drawGloss(grid){
  grid.innerHTML='';
  const q=glossQ.trim().toLowerCase();
  const list=GLOSSARY.filter(g=> !q || (g.t+' '+g.full+' '+g.def).toLowerCase().includes(q));
  if(!list.length){ grid.appendChild(el('div','empty','<div class="big">🔍</div>Nenhum termo encontrado.')); return; }
  const cats=[...new Set(list.map(g=>g.cat))];
  cats.forEach(cat=>{
    grid.appendChild(el('div','gcat',cat));
    list.filter(g=>g.cat===cat).forEach(g=>{
      const c=el('div','card gterm');
      c.innerHTML=`<div class="ab">${esc(g.t)}</div><div class="fn">${esc(g.full)}</div><div class="df">${esc(g.def)}</div>`;
      grid.appendChild(c);
    });
  });
}
