<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blendibox Sourcing China</title>
<meta name="description" content="Sistema de sourcing de fábricas de bolsas puffer na China: polos, fornecedores, custo de importação, dados ao vivo do Comex Stat e roteiro aduaneiro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ⚙️ CONFIG: troque pela URL do seu Worker após o deploy -->
<script>
  window.BB_CONFIG = {
    workerUrl: "https://blendibox-comex-api.blendibox.workers.dev"
  };
  // tema (dark por padrão) aplicado cedo para evitar flash
  try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('bb_theme') || 'dark'); }
  catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
</script>

<style>
/* ===========================================================
   Tema NEON / IA — fundo azul-marinho profundo, azul elétrico +
   ciano, magenta e violeta. Ícones de cor única (ciano). Dark único.
   =========================================================== */
:root{
  --bg:#060a1b; --bg2:#0a1028;
  --panel:#0e1533; --panel-2:#121a3d; --panel-hi:#17205090;
  --line:#243066; --line-strong:#33449a;
  --ink:#eaf0ff; --ink-soft:#97a4d6; --ink-dim:#6773a6;
  --blue:#3b82f6; --cyan:#22d3ee; --pink:#ff2e7e; --violet:#8b5cf6;
  --accent:#3b82f6; --accent-ink:#8fb6ff; --accent-soft:#16255e;
  --icon:var(--cyan);
  --grad:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 50%,#ff2e7e 100%);
  --grad-soft:linear-gradient(135deg,#16255e,#241a52);
  --ok:#2dd4a7; --ok-soft:#0c3b33; --warn:#fbbf24; --warn-soft:#3a2f0e;
  --bad:#fb4e6d; --bad-soft:#3a1324; --gray:#8a95c4; --gray-soft:#1a2247;
  --glow-blue:0 0 24px rgba(59,130,246,.35);
  --glow-pink:0 0 24px rgba(255,46,126,.3);
  --shadow:0 2px 6px rgba(0,0,0,.4),0 10px 30px rgba(6,10,30,.5);
  --shadow-lg:0 20px 60px rgba(4,8,24,.7);
  --r:16px; --r-sm:10px;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --maxw:1180px;
  color-scheme:dark;
}
/* ---- TEMA CLARO (mesma identidade, fundo claro) ---- */
:root[data-theme="light"]{
  --bg:#eef1fb; --bg2:#e4e9f7;
  --panel:#ffffff; --panel-2:#f4f6fe; --panel-hi:#eef1fbcc;
  --line:#dde3f3; --line-strong:#c4cdea;
  --ink:#141b34; --ink-soft:#55608b; --ink-dim:#8591b5;
  --cyan:#0e8ba8; --icon:#0e8ba8;
  --accent-ink:#2a4bd0; --accent-soft:#e4e9ff;
  --grad-soft:linear-gradient(135deg,#e4e9ff,#f1e6fb);
  --ok:#0f9d6e; --ok-soft:#d6f4e7; --warn:#a9710a; --warn-soft:#fbeccb;
  --bad:#e23a5c; --bad-soft:#fce0e8; --gray:#5e6a94; --gray-soft:#edf0f8;
  --glow-blue:0 0 22px rgba(59,130,246,.16); --glow-pink:0 0 22px rgba(255,46,126,.16);
  --shadow:0 1px 2px rgba(20,30,70,.06),0 10px 30px rgba(30,50,110,.08);
  --shadow-lg:0 20px 60px rgba(30,50,110,.16);
  color-scheme:light;
}
:root[data-theme="light"] body::before{opacity:.5}
:root[data-theme="light"] .pill.cyan{background:#d3eff6;color:#0b7285}
:root[data-theme="light"] .step .num{background:#daf0f6;color:#0b7285}
:root[data-theme="light"] #tip{background:#ffffff;color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;
}
body::before{ /* aura neon de fundo */
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 12% -8%, rgba(255,46,126,.14), transparent 60%),
    radial-gradient(55vw 50vh at 92% 0%, rgba(59,130,246,.18), transparent 60%),
    radial-gradient(70vw 60vh at 50% 110%, rgba(139,92,246,.16), transparent 60%),
    var(--bg);
}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink);text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-variant-numeric:tabular-nums}
[data-lucide]{width:1em;height:1em}
svg.lucide{width:1em;height:1em;stroke:var(--icon);vertical-align:-.125em}

/* layout: menu lateral + topbar (mobile-first) */
.shell{min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:266px;max-width:85vw;z-index:60;
  background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;
  padding:18px;padding-top:calc(38px+env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));
  overflow-y:auto;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
.sidebar .brand{padding-left:4px;padding-top:8px;margin-bottom:8px}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(3,6,18,.55);backdrop-filter:blur(2px);z-index:55;opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s}
.overlay.open{opacity:1;visibility:visible}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  background:var(--panel-hi);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-bottom:16px;padding-top:8px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.hamb,.theme-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink);cursor:pointer;flex:none}
.hamb svg.lucide,.theme-btn svg.lucide{stroke:currentColor;width:20px;height:20px}
.hamb:hover,.theme-btn:hover{border-color:var(--cyan)}
.tb-brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.theme-wide{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:13.5px;cursor:pointer}
.theme-wide:hover{border-color:var(--cyan)}
.theme-wide svg.lucide{stroke:var(--icon);width:18px;height:18px}
.main-col{min-height:100vh}
@media(min-width:900px){
  .sidebar{transform:none;box-shadow:none}
  .overlay{display:none}.topbar{display:none}.hamb{display:none}
  .main-col{margin-left:266px}
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;flex:none;
  box-shadow:var(--glow-pink);position:relative}
.logo svg{stroke:#fff;width:22px;height:22px}
.brand h1{font-size:17px;line-height:1.05;font-weight:700}
.brand h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.badge-live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:11px;font-weight:600;
  color:var(--cyan);background:var(--panel-2);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.badge-live .pulse{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.side-nav{display:flex;flex-direction:column;gap:5px;margin-top:22px}
.side-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:var(--ink-soft);font-family:var(--f-display);font-size:14px;font-weight:500;padding:10px 12px;border-radius:11px;cursor:pointer}
.side-nav button svg.lucide{stroke:currentColor;width:18px;height:18px;flex:none}
.side-nav button:hover{background:var(--panel-2);color:var(--ink)}
.side-nav button[aria-selected="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow-blue)}
.side-nav button[aria-selected="true"] svg.lucide{stroke:#fff}

main{padding-block:42px 64px}
.panel-view{display:flex;flex-direction:column;gap:20px}
.lead .eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cyan);display:inline-flex;align-items:center;gap:7px}
.lead h2{font-size:27px;margin-top:7px;font-weight:700}
.lead p{color:var(--ink-soft);margin-top:9px;max-width:64ch}

.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g-3,.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g-2,.g-3,.g-4{grid-template-columns:1fr}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;font-family:var(--f-display)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.cyan{background:#0b3a46;color:var(--cyan)}
.pill.pink{background:var(--bad-soft);color:var(--pink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:var(--gray-soft);color:var(--gray)}
.pill.violet{background:#241a52;color:#b89bff}

.stat{padding:17px 18px;border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--grad);opacity:.12;filter:blur(8px)}
.stat .ic{font-size:18px;color:var(--cyan)}
.stat .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;margin-top:8px}
.stat .l{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

.pillars{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:720px){.pillars{grid-template-columns:1fr}}
.pillar{padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);position:relative}
.pillar .ic{font-size:22px;color:var(--cyan)}
.pillar h4{font-size:15px;margin:11px 0 6px}
.pillar p{font-size:13px;color:var(--ink-soft)}

.hub{display:flex;flex-direction:column;gap:12px;padding:18px;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
.hub:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow-lg),var(--glow-blue)}
.hub .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hub h3{font-size:17px}
.hub .loc,.hub .cn{font-size:12px;color:var(--ink-soft)}
.fit{display:flex;align-items:center;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.dot.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.hub .spec{font-size:13px;color:var(--ink-soft)}
.hub .tags{display:flex;flex-wrap:wrap;gap:5px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
select,input,textarea{font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
label.fld span{font-family:var(--f-display)}

.drawer-bg{position:fixed;inset:0;background:rgba(3,6,18,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.drawer-bg.open{display:flex}
.drawer{background:linear-gradient(180deg,var(--panel),var(--panel-2));width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line-strong);
  padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
@media(min-width:640px){.drawer-bg{align-items:center}.drawer{border-radius:20px}}
.drawer h3{font-size:21px}
.close{float:right;background:var(--panel-hi);border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 14px;font-size:13.5px;margin-top:6px}
.kv dt{color:var(--ink-soft);font-weight:600}.kv dd{margin:0}
@media(max-width:480px){.kv{grid-template-columns:1fr}.kv dt{margin-top:8px}}

.btn{font-family:var(--f-display);font-weight:600;font-size:14px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.btn svg.lucide{stroke:currentColor}
.btn.primary{background:var(--grad);color:#fff;box-shadow:var(--glow-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel-2);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.sup-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sup-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sup{padding:16px;display:flex;flex-direction:column;gap:11px}
.sup .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sup h4{font-size:15.5px}
.sup .meta{font-size:12px;color:var(--ink-soft)}
.score-pill{font-family:var(--f-display);font-weight:700;font-size:15px;padding:2px 10px;border-radius:8px}
.sup .vals{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;color:var(--ink-soft)}
.sup .vals b{font-family:var(--f-display);color:var(--ink)}
.sup .acts{display:flex;gap:6px;margin-top:2px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
.empty .big{font-size:30px;margin-bottom:10px;color:var(--cyan)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft)}
.banner.warn{border-color:#5a4a12;color:var(--warn)}
.banner.info{border-color:#1e4a6e;color:var(--accent-ink)}
.banner svg.lucide{stroke:currentColor;font-size:17px;flex:none}
.stars{display:inline-flex;gap:3px}
.stars span{font-size:19px;color:var(--line-strong);cursor:pointer;line-height:1}
.stars span.on{color:var(--cyan);text-shadow:0 0 8px rgba(34,211,238,.6)}

.modal-bg{position:fixed;inset:0;background:rgba(3,6,18,.74);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
.modal-bg.open{display:flex}
.modal{background:linear-gradient(180deg,var(--panel),var(--panel-2));border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;border:1px solid var(--line-strong);box-shadow:var(--shadow-lg)}
.modal h3{font-size:19px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
textarea{resize:vertical;min-height:62px}

.calc{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:860px){.calc{grid-template-columns:1fr}}
.calc-inputs{display:flex;flex-direction:column;gap:12px}
.inrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rtile{padding:14px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.rtile .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rtile .v{font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:4px}
.rtile.hero{background:var(--grad);color:#fff;border-color:transparent;grid-column:1/-1;box-shadow:var(--glow-blue)}
.rtile.hero .l{color:rgba(255,255,255,.8)}
.taxtable{width:100%;border-collapse:collapse;font-size:13.5px}
.taxtable td,.taxtable th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.taxtable th{font-family:var(--f-display);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.taxtable td:last-child,.taxtable th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar-wrap{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:140px 1fr 86px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:10px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--grad)}

.phase{display:flex;flex-direction:column;gap:12px}
.phase-h{display:flex;align-items:center;gap:11px}
.phase-n{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--grad);color:#fff;width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none;box-shadow:var(--glow-blue)}
.phase-h h3{font-size:17px}
.step{display:flex;gap:13px;padding:15px 16px}
.step .num{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--cyan);background:#0b2f40;min-width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.step h4{font-size:14.5px}
.step .b{font-size:13px;color:var(--ink-soft);margin-top:4px}
.step .risk{font-size:12.5px;margin-top:8px;padding:8px 11px;border-radius:9px;background:var(--bad-soft);color:var(--pink);display:flex;gap:7px}
.step .risk svg.lucide{stroke:currentColor;flex:none}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:620px){.channels{grid-template-columns:repeat(2,1fr)}}
.chan{padding:14px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--panel-2)}
.chan .sq{font-size:21px;color:var(--cyan)}
.chan h5{font-family:var(--f-display);font-size:13px;margin:7px 0 4px}
.chan p{font-size:11.5px;color:var(--ink-soft)}
.chan .emoji{font-size:21px}

.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.check:last-child{border-bottom:none}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--cyan);flex:none}
.tmpl{position:relative}
.tmpl pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0 0;color:var(--ink)}
.copy{position:absolute;top:8px;right:8px}
details.src summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:600}

/* mercado */
.mkt-form{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:flex-end}
@media(max-width:760px){.mkt-form{grid-template-columns:1fr 1fr}}
.mkt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.mkt-tiles{grid-template-columns:repeat(2,1fr)}}
.ctry-row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13px;padding:6px 0}

.userbar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft)}

.cnterms{display:flex;flex-wrap:wrap;gap:6px}

.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-dim);line-height:1.6}

/* glossário */
.term{border-bottom:1px dashed var(--cyan);cursor:help;color:inherit}
.term:hover,.term.active{background:rgba(34,211,238,.14)}
#tip{position:fixed;z-index:80;max-width:300px;background:#0a1030;color:var(--ink);border:1px solid var(--line-strong);
  padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow-lg),var(--glow-blue);

#tip.show{opacity:1;transform:translateY(0);visibility:visible}
#tip b{font-family:var(--f-display);display:block;margin-bottom:3px;color:var(--cyan)}
.gloss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

let authToken='',authUser='';
try{authToken=localStorage.getItem('bb_token')||'';authUser=localStorage.getItem('bb_user')||'';}catch(e){}
function setAuth(token,name){authToken=token||'';authUser=name||'';try{localStorage.setItem('bb_token',authToken);localStorage.setItem('bb_user',authUser);}catch(e){}}
function clearAuth(){authToken='';authUser='';try{localStorage.removeItem('bb_token');localStorage.removeItem('bb_user');}catch(e){}}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(authToken) headers['Authorization']='Bearer '+authToken;
  const res=await fetch(WORKER+path,Object.assign({},opts,{headers}));
  let data=null;try{data=await res.json();}catch(e){}
  if(res.status===401){const e=new Error('auth');e.code='auth';e.data=data;throw e;}
  if(!res.ok){const e=new Error('http');e.code=(data&&data.error)||'http';e.status=res.status;e.data=data;throw e;}
  return data;
}
async function authPost(path,body){
  const res=await fetch(WORKER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){const e=new Error('http');e.code=(data&&data.error)||'http';e.status=res.status;e.data=data;throw e;}
  return data;
}

let suppliers=[];let useLocal=!CONFIGURED;let supLoaded=false;let supErr=null;let supStatusFilter=null;
let authMode='login';let authMsg=null;
const STATUSES=[["prospect","Prospect","gray"],["contatado","Contatado","cyan"],["amostra","Amostra","warn"],["negociando","Negociando","warn"],["aprovado","Aprovado","ok"],["rejeitado","Rejeitado","bad"]];
const statusMeta=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];
function scoreOf(s){const vals=[s.sQuality,s.sPrice,s.sComm,s.sRel].filter(x=>x>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;}
function saveLocal(){try{localStorage.setItem('bb_suppliers',JSON.stringify(suppliers));}catch(e){}}

async function loadSuppliers(force){
  if(useLocal){try{suppliers=JSON.parse(localStorage.getItem('bb_suppliers')||'[]');}catch(e){suppliers=[];}supLoaded=true;if(active==='suppliers'||active==='overview')render();return;}
  if(!authToken){if(active==='suppliers')render();return;}
  if(supLoaded&&!force)return;
  try{const j=await api('/api/suppliers');suppliers=j.list||[];supErr=null;supLoaded=true;if(active==='suppliers'||active==='overview')render();}
  catch(e){if(e.code==='auth'){clearAuth();supLoaded=false;}else{supErr='net';}if(active==='suppliers')render();}
}
async function upsertSupplier(data){
  if(useLocal){if(data._id){const i=suppliers.findIndex(s=>s._id===data._id);if(i>=0)suppliers[i]=data;}else{data._id='s_'+Date.now();data.createdAt=Date.now();suppliers.unshift(data);}saveLocal();render();return;}
  try{const j=await api('/api/suppliers',{method:'POST',body:JSON.stringify(data)});
    const it=j.item;const i=suppliers.findIndex(s=>s._id===it._id);if(i>=0)suppliers[i]=it;else suppliers.unshift(it);
    suppliers.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();}
  catch(e){if(e.code==='auth'){clearAuth();supLoaded=false;render();}else alert('Falha ao salvar no servidor.');}
}
async function deleteSupplier(id){
  if(useLocal){suppliers=suppliers.filter(s=>s._id!==id);saveLocal();render();return;}
  try{await api('/api/suppliers?id='+encodeURIComponent(id),{method:'DELETE'});suppliers=suppliers.filter(s=>s._id!==id);render();}
  catch(e){if(e.code==='auth'){clearAuth();supLoaded=false;render();}else alert('Falha ao excluir no servidor.');}
}

function authCard(){

  } else {
    form=`<label class="fld"><span>E-mail</span><input id="a_email" type="email" autocomplete="username" placeholder="voce@empresa.com"></label>
      <label class="fld"><span>Senha</span><input id="a_pass" type="password" autocomplete="current-password" placeholder="••••••"></label>
      <button class="btn primary" id="a_go">${ic('log-in')} Entrar</button>
      <button class="linkbtn" id="a_forgot">Esqueci minha senha</button>`;
  }
  c.innerHTML=`<div class="authtabs">${tab('login','Entrar')}${tab('register','Cadastrar')}</div>
    ${authMsg?`<div class="authmsg ${authMsg.ok?'ok':'err'}">${esc(authMsg.text)}</div>`:''}
    <div class="authform">${form}</div>`;

    const email=(emailEl&&emailEl.value||'').trim();
    if(authMode==='login') doLogin(email,c.querySelector('#a_pass').value);
    else if(authMode==='register') doRegister(c.querySelector('#a_name').value.trim(),email,c.querySelector('#a_pass').value,(c.querySelector('#a_code')||{}).value||'');

async function runMkt(out){
  mkt.loading=true;mkt.err=null;drawMkt(out);
  try{
    const qs=`?flow=${mkt.flow}&ncm=${mkt.ncm}&from=${mkt.fromY}-01&to=${mkt.toY}-12`;
    const res=await fetch(WORKER+'/api/comexstat'+qs);
    if(!res.ok)throw new Error('http');
    mkt.data=await res.json();
  }catch(e){mkt.err='Falha ao consultar o Comex Stat (verifique a URL do Worker).';mkt.data=null;}
  mkt.loading=false;drawMkt(out);
}
function drawMkt(out){
  out.innerHTML='';
  if(mkt.loading){out.appendChild(el('div','card pad',`<span class="spin"></span> consultando Comex Stat...`));icons();return;}
  if(mkt.err){out.appendChild(banner('warn','triangle-alert',esc(mkt.err)));icons();return;}
  if(!mkt.data){out.appendChild(el('div','banner info',`${ic('info')}<span>Escolha a NCM e o período e clique em <b>Consultar</b>. Começa em 42022220 (bolsas têxteis — as mais próximas das puffer).</span>`));icons();return;}
  const list=mkt.data.list||[];
  if(!list.length){out.appendChild(el('div','card empty','Nenhum registro para essa NCM/período.'));return;}
  // agrega por país (soma anos do intervalo)
  const byC={};let totFob=0,totKg=0;
  list.forEach(r=>{const c=r.country||'—';byC[c]=byC[c]||{fob:0,kg:0};byC[c].fob+=r.fob;byC[c].kg+=r.kg;totFob+=r.fob;totKg+=r.kg;});
  const countries=Object.entries(byC).map(([c,v])=>({c,fob:v.fob,kg:v.kg,share:totFob?v.fob/totFob:0,price:v.kg?v.fob/v.kg:0})).sort((a,b)=>b.fob-a.fob);
  const china=byC['China'];const chinaShare=china&&totFob?china.fob/totFob:0;
  const avgPrice=totKg?totFob/totKg:0;
  const desc=list[0].descricao||'';
  const flowLabel=mkt.flow==='import'?'importou':'exportou';

  const tiles=el('div','mkt-tiles');
  [["dollar-sign",usdC(totFob),"Total "+(mkt.flow==='import'?'importado':'exportado')+" ("+mkt.fromY+"–"+mkt.toY+")"],
   ["weight",(totKg/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+" t","Peso total"],
   ["tag","US$ "+avgPrice.toLocaleString('pt-BR',{maximumFractionDigits:2})+"/kg","Preço médio de referência"],

async function runRanking(out){
  rank.loading=true;rank.err=null;rank.rows=null;drawRanking(out);
  try{
    const results=await Promise.all(BAG_NCMS.map(async n=>{
      try{
        const r=await fetch(WORKER+`/api/comexstat?flow=import&ncm=${n.code}&from=${rank.fromY}-01&to=${rank.toY}-12`);
        if(!r.ok) throw 0;
        const j=await r.json();const list=j.list||[];
        let chinaFob=0,chinaKg=0,totFob=0,desc='';
        list.forEach(x=>{totFob+=x.fob;if(!desc)desc=x.descricao;if(x.country==='China'){chinaFob+=x.fob;chinaKg+=x.kg;}});
        return {code:n.code,label:n.label,desc:desc||n.label,chinaFob,chinaKg,totFob,share:totFob?chinaFob/totFob:0,price:chinaKg?chinaFob/chinaKg:0};
      }catch(e){return {code:n.code,label:n.label,desc:n.label,chinaFob:0,chinaKg:0,totFob:0,share:0,price:0};}
    }));
    results.sort((a,b)=>b.chinaFob-a.chinaFob);
    rank.rows=results;
  }catch(e){rank.err='Falha ao gerar o ranking. Verifique a conexão/Worker.';}
  rank.loading=false;drawRanking(out);
}

    const medal=i<3?['#ffd24a','#c9d2e3','#e08a4a'][i]:'var(--ink-dim)';
    row.innerHTML=`<div style="font-family:var(--f-display);font-weight:700;color:${medal};font-size:16px">${i+1}</div>

        <div class="bar-track" style="margin-top:6px"><div class="bar-fill" style="width:${(r.chinaFob/max*100).toFixed(1)}%"></div></div>
      </div>

      </div>`;

/* ============================ REGIME TRIBUTÁRIO ============================ */
const SIMPLES_I=[
  {upTo:180000,rate:0.04,pd:0},{upTo:360000,rate:0.073,pd:5940},{upTo:720000,rate:0.095,pd:13860},
  {upTo:1800000,rate:0.107,pd:22500},{upTo:3600000,rate:0.143,pd:87300},{upTo:4800000,rate:0.19,pd:378000},
];
function simplesEff(rbt12){for(const f of SIMPLES_I){if(rbt12<=f.upTo)return Math.max(0,(rbt12*f.rate-f.pd)/rbt12);}return null;}
function regTaxes(rev,p){
  const margin=(p.margin||0)/100,opex=(p.opex||0)/100,icms=(p.icms||0)/100,folha=p.folha||0;
  const cost=rev*(1-margin);
  const icmsNormal=(p.venda==='atacado')?Math.min(icms,0.12):icms; // atacado SP: redução de base -> carga ~12%
  const icmsLiq=icmsNormal*margin*rev;     // ICMS sobre valor agregado (só Presumido/Real; Simples não aproveita)
  const inss=0.288*folha;                  // INSS patronal ~20% + ~8,8% terceiros/RAT
  const rbt12=rev*12;const eff=simplesEff(rbt12);
  const simples=(eff==null)?null:eff*rev;  // DAS já inclui ICMS/PIS/COFINS/IRPJ/CSLL/CPP
  // Lucro Presumido
  const pcPres=0.0365*rev;const irpjBase=0.08*rev;
  const irpjPres=0.15*irpjBase+0.10*Math.max(0,irpjBase-20000);const csllPres=0.09*0.12*rev;
  const presumido=pcPres+irpjPres+csllPres+icmsLiq+inss;
  // Lucro Real
  const pcReal=0.0925*margin*rev;          // 9,25% sobre valor agregado (crédito sobre custo/importação)
  const lucro=rev-cost-opex*rev-folha;
  const irpjReal=lucro>0?0.15*lucro+0.10*Math.max(0,lucro-20000):0;const csllReal=lucro>0?0.09*lucro:0;
  const real=pcReal+irpjReal+csllReal+icmsLiq+inss;
  return {simples,presumido,real,eff,icmsLiq,inss,lucro,cost};
}
function cheapestAt(rev,p){const t=regTaxes(rev,p);const o=[['Simples',t.simples],['Presumido',t.presumido],['Lucro Real',t.real]].filter(x=>x[1]!=null);o.sort((a,b)=>a[1]-b[1]);return o.length?o[0][0]:'—';}

  w.appendChild(banner('warn','triangle-alert','Simulação <b>simplificada e de direção</b>. Não considera ICMS‑ST, DIFAL, benefícios setoriais, sublimite do Simples, IPI, PIS/COFINS monofásico nem particularidades do seu estado. Impostos da <b>importação</b> ficam na aba Custo — aqui é só a <b>venda</b>. Decida com seu contador.'));

  const form=el('div','card pad');
  const fld=(id,lbl,suf)=>`<label class="fld"><span>${lbl}${suf?' ('+suf+')':''}</span><input id="rg_${id}" type="number" step="0.01" value="${reg[id]}"></label>`;
  form.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end">
    ${fld('rev','Faturamento mensal','R$')}${fld('margin','Margem bruta','%')}${fld('opex','Despesas oper.','% receita')}${fld('folha','Folha','R$/mês')}${fld('icms','ICMS saída','%')}
    <label class="fld"><span>Tipo de venda</span><select id="rg_venda"><option value="varejo" ${reg.venda==='varejo'?'selected':''}>Varejo (consumidor final)</option><option value="atacado" ${reg.venda==='atacado'?'selected':''}>Atacado / B2B em SP</option></select></label>
    <button class="btn ghost sm" id="rg_reset">${ic('rotate-ccw')} Restaurar</button></div>`;
  w.appendChild(form);
  const out=el('div');out.id='rgOut';w.appendChild(out);
  form.querySelectorAll('input').forEach(i=>i.oninput=()=>{const k=i.id.slice(3);reg[k]=i.value===''?0:(+i.value);drawReg(out);});
  const vsel=form.querySelector('#rg_venda');if(vsel)vsel.onchange=()=>{reg.venda=vsel.value;drawReg(out);};
  form.querySelector('#rg_reset').onclick=()=>{reg={rev:50000,margin:55,opex:20,folha:5000,icms:18,venda:'varejo'};go('regime');};
  drawReg(out);
  return w;

function drawReg(out){
  const t=regTaxes(reg.rev,reg);const rev=reg.rev||0;
  const pct=v=>rev&&v!=null?(v/rev*100).toFixed(1)+'%':'—';
  const items=[['Simples Nacional',t.simples,'Anexo I · DAS único sobre faturamento'],['Lucro Presumido',t.presumido,'PIS/COFINS 3,65% + IRPJ/CSLL presumidos + ICMS'],['Lucro Real',t.real,'Créditos de PIS/COFINS/ICMS + IRPJ/CSLL sobre o lucro']];
  const valid=items.filter(x=>x[1]!=null);const min=valid.length?Math.min(...valid.map(x=>x[1])):0;
  const cards=el('div');cards.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px';
  items.forEach(([name,val,sub])=>{
    const best=val!=null&&val===min;

const IRPF_TABLE=[
  {upTo:2259.20,rate:0,ded:0},{upTo:2826.65,rate:0.075,ded:169.44},{upTo:3751.05,rate:0.15,ded:381.44},
  {upTo:4664.68,rate:0.225,ded:662.77},{upTo:Infinity,rate:0.275,ded:896.00},
];
function irpfMensal(base){for(const f of IRPF_TABLE){if(base<=f.upTo)return Math.max(0,base*f.rate-f.ded);}return 0;}
function holdingImposto(rent){const pc=0.0365*rent;const b=0.32*rent;const irpj=0.15*b+0.10*Math.max(0,b-20000);const csll=0.09*b;return pc+irpj+csll;}
let hld={rent:6000,contabil:600};
VIEWS.holding=()=>{
  const w=el('div','panel-view');
  w.appendChild(lead("building-2","Patrimônio imobiliário","Holding de aluguel × receber como pessoa física",

    <div style="font-size:11.5px;color:var(--ink-dim)">PF: tabela mensal do carnê‑leão. Holding: Presumido (~11,33% + adicional). Lucro distribuído da holding para você é <b>isento</b>.</div>`;
  grid.appendChild(ins);
  const out=el('div');out.id='hldOut';grid.appendChild(out);
  w.appendChild(grid);
  ins.querySelectorAll('input').forEach(i=>i.oninput=()=>{const k=i.id.slice(2);hld[k]=i.value===''?0:(+i.value);drawHolding(out);});
  drawHolding(out);

  // explicação
  const exp=el('div','card pad');
  exp.innerHTML=`<h3 style="font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px">${ic('info')} O que colocar (e o que NÃO colocar) na holding</h3>
    <div style="overflow-x:auto"><table class="taxtable"><thead><tr><th>Imóvel</th><th>Na holding?</th><th>Por quê</th></tr></thead><tbody>
      <tr><td><b>Casas alugadas a terceiros</b></td><td style="color:var(--ok);font-weight:700">Sim</td><td>Troca ~27,5% (PF) por ~11–14% (PJ) sobre o aluguel.</td></tr>

      <tr><td><b>Casa onde você mora</b></td><td style="color:var(--bad);font-weight:700">Não</td><td>Sem aluguel = sem ganho; perde o <b>bem de família</b> (impenhorabilidade) e a <b>isenção de IR</b> na venda.</td></tr>
    </tbody></table></div>
    <ul style="margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.7">
      <li><b>ITBI na entrada:</b> holding de locação costuma <b>perder a imunidade</b> de ITBI na integralização → pode pagar ~2–3% do valor do imóvel ao transferir. Avalie com o município.</li>
      <li><b>Forma:</b> holding é uma PJ separada (SLU sozinho, ou LTDA com a família p/ sucessão) — não use a sua EI.</li>
      <li><b>Regime:</b> holding de aluguel vai no <b>Lucro Presumido</b>, não no Simples.</li>
    </ul>`;
  w.appendChild(exp);

  // barracão fora do simples

    <p style="font-size:13.5px;color:var(--ink-soft)">No <b>Simples</b>, o aluguel do barracão pago à holding <b>não reduz</b> o imposto da Blendibox (despesa não abate o DAS) — então só compensa por proteção/sucessão. No <b>Lucro Presumido/Real</b>, esse aluguel vira <b>despesa dedutível</b>: economiza ~<b>34%</b> (IRPJ+CSLL) na operação e paga ~<b>11%</b> na holding → economia líquida de ~<b>23%</b> sobre o valor do aluguel. Ou seja: a holding do barracão “liga” quando você <b>sai do Simples</b> — veja a aba <b>Regime tributário</b> para achar esse ponto.</p>`;
  w.appendChild(bar);

};
function drawHolding(out){
  const rent=hld.rent||0;const contabil=hld.contabil||0;
  const pf=irpfMensal(rent);const hImp=holdingImposto(rent);const hTot=hImp+contabil;
  const eco=pf-hTot;
  const pct=v=>rent?(v/rent*100).toFixed(1)+'%':'—';
  const tile=(l,v,sub,col)=>{const c=el('div','rtile');c.innerHTML=`<div class="l">${l}</div><div class="v"${col?` style="color:${col}"`:''}>${v}</div><div style="font-size:12px;color:var(--ink-soft)">${sub}</div>`;return c;};
  const cards=el('div');cards.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px';
  cards.appendChild(tile('Pessoa Física (carnê‑leão)',money(pf),pct(pf)+' do aluguel'));
  cards.appendChild(tile('Holding (Presumido)',money(hTot),pct(hImp)+' imposto + '+money(contabil)+' contábil'));
  const hero=el('div','rtile');hero.style.cssText='grid-column:1/-1;'+(eco>0?'background:var(--grad);border-color:transparent;box-shadow:var(--glow-blue)':'');
  const hc=eco>0?'#fff':'var(--ink)';
  hero.innerHTML=`<div class="l" style="color:${eco>0?'rgba(255,255,255,.8)':'var(--ink-soft)'}">${eco>0?'Economia com a holding':'A holding ainda NÃO compensa'}</div>
    <div class="v" style="color:${hc}">${eco>0?money(eco)+'/mês':money(-eco)+'/mês a mais'}</div>
    <div style="font-size:12px;color:${eco>0?'rgba(255,255,255,.8)':'var(--ink-soft)'}">${eco>0?'= '+money(eco*12)+'/ano a menos de imposto (já descontando o contador)':'o custo contábil supera a economia de imposto neste valor'}</div>`;
  cards.appendChild(hero);

  // ponto de virada
  let be=null;for(let r=1000;r<=50000;r+=250){if(irpfMensal(r)-(holdingImposto(r)+contabil)>0){be=r;break;}}
  const insight=el('div','card pad');
  insight.innerHTML=`<h3 style="font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px">${ic('git-compare-arrows')} Ponto de virada</h3>
    <p style="font-size:13.5px;color:var(--ink-soft)">${be?`Com custo contábil de <b>${money(contabil)}/mês</b>, a holding passa a compensar a partir de um aluguel total de ~<b class="china">${money(be)}/mês</b>. Abaixo disso, receber como pessoa física tende a sair mais barato (o contador come a economia).`:'Nesta faixa, a holding compensa em praticamente qualquer valor de aluguel.'}</p>`;

  // tabela por faixa
  const levels=[2000,4000,6000,10000,15000,20000,30000];
  let rows='';
  levels.forEach(lv=>{const p=irpfMensal(lv);const h=holdingImposto(lv)+contabil;const best=h<p?'h':'p';
    rows+=`<tr><td class="mono">${money(lv)}</td>
      <td class="mono" style="${best==='p'?'color:var(--ok);font-weight:700':''}">${money(p)} <span style="color:var(--ink-dim)">(${(p/lv*100).toFixed(1)}%)</span></td>
      <td class="mono" style="${best==='h'?'color:var(--ok);font-weight:700':''}">${money(h)} <span style="color:var(--ink-dim)">(${(h/lv*100).toFixed(1)}%)</span></td></tr>`;});
  const tbl=el('div','card pad');
  tbl.innerHTML=`<h3 style="font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px">${ic('table')} PF × Holding por valor de aluguel</h3>
    <p style="font-size:12px;color:var(--ink-dim);margin-bottom:10px">Imposto mensal; holding já inclui o custo contábil de ${money(contabil)}. Verde = mais barato.</p>
    <div style="overflow-x:auto"><table class="taxtable"><thead><tr><th>Aluguel/mês</th><th>Pessoa Física</th><th>Holding</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="foot">PF: tabela do carnê‑leão (valores de referência; a reforma do IR pode alterar as faixas). Holding: Presumido (PIS/COFINS 3,65% + IRPJ 4,8% + CSLL 2,88% sobre a receita de aluguel, + adicional). Não inclui ITBI de entrada nem IR sobre eventual venda do imóvel. Estimativa — confirme com contador/advogado.</div>`;

  out.innerHTML='';out.style.cssText='display:flex;flex-direction:column;gap:16px';
  out.appendChild(cards);out.appendChild(insight);out.appendChild(tbl);
  applyGlossary(out);icons();
}

try{const sv=JSON.parse(localStorage.getItem('bb_calc')||'null');if(sv)calc=Object.assign({},CALC_DEF,sv);}catch(e){}

    <div style="font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--cyan);margin-top:4px">Venda</div>${field('markup','Markup sobre custo (x)')}

  ins.querySelectorAll('input').forEach(i=>i.oninput=()=>{const k=i.id.slice(2);calc[k]=i.value===''?0:(+i.value);try{localStorage.setItem('bb_calc',JSON.stringify(calc));}catch(e){}drawCalc(out);});
  ins.querySelector('#c_reset').onclick=()=>{calc=Object.assign({},CALC_DEF);try{localStorage.removeItem('bb_calc');}catch(e){}go('calc');};
  drawCalc(out);
  return w;
};
function computeCalc(c){
  const fobTotalUSD=(c.fob||0)*(c.qty||0);const freightBRL=(c.freight||0)*(c.rate||0);
  const va=(fobTotalUSD+(c.freight||0)+(c.insurance||0))*(c.rate||0);
  const ii=va*(c.ii||0)/100;const ipi=(va+ii)*(c.ipi||0)/100;const pis=va*(c.pis||0)/100;const cofins=va*(c.cofins||0)/100;
  const afrmm=freightBRL*(c.afrmm||0)/100;const despBase=(c.siscomex||0)+(c.desp||0)+afrmm;const icmsRate=(c.icms||0)/100;
  const icmsBase=icmsRate<1?(va+ii+ipi+pis+cofins+despBase)/(1-icmsRate):0;const icms=icmsBase*icmsRate;
  const totalTrib=ii+ipi+pis+cofins+icms;const totalDesp=(c.siscomex||0)+(c.desp||0)+afrmm;const landed=va+totalTrib+totalDesp;
  const perUnit=(c.qty?landed/c.qty:0);const retail=perUnit*(c.markup||0);
  return {va,ii,ipi,pis,cofins,afrmm,icms,totalTrib,totalDesp,landed,perUnit,retail,fobUnitBRL:(c.fob||0)*(c.rate||0)};
}
function drawCalc(out){

    <div class="rtile"><div class="l">Custo total do lote</div><div class="v">${money(r.landed)}</div></div>

    <div class="rtile"><div class="l">Valor aduaneiro (CIF)</div><div class="v">${money(r.va)}</div></div>
    <div class="rtile"><div class="l">Preço sugerido (${(c.markup||0)}×)</div><div class="v" style="color:var(--cyan)">${money(r.retail)}</div></div></div>`;
  const rows=[["Imposto de Importação (II)",r.ii],["IPI",r.ipi],["PIS-Importação",r.pis],["COFINS-Importação",r.cofins],["ICMS",r.icms],["AFRMM",r.afrmm],["Siscomex + despesas",(c.siscomex||0)+(c.desp||0)]];
  const maxv=Math.max(...rows.map(x=>x[1]),1);
  const bars=`<div class="bar-wrap">${rows.map(([l,v])=>`<div class="bar-row"><div>${l}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxv*100).toFixed(1)}%"></div></div><div class="mono" style="text-align:right">${money(v)}</div></div>`).join('')}</div>`;
  const table=`<table class="taxtable"><thead><tr><th>Componente</th><th>Valor (R$)</th></tr></thead><tbody>
    <tr><td>Valor aduaneiro (CIF)</td><td class="mono">${money(r.va)}</td></tr>
    <tr><td>+ II (${c.ii}%)</td><td class="mono">${money(r.ii)}</td></tr>
    <tr><td>+ IPI (${c.ipi}%)</td><td class="mono">${money(r.ipi)}</td></tr>
    <tr><td>+ PIS (${c.pis}%)</td><td class="mono">${money(r.pis)}</td></tr>
    <tr><td>+ COFINS (${c.cofins}%)</td><td class="mono">${money(r.cofins)}</td></tr>
    <tr><td>+ ICMS (${c.icms}% por dentro)</td><td class="mono">${money(r.icms)}</td></tr>
    <tr><td>+ AFRMM + Siscomex + despesas</td><td class="mono">${money(r.totalDesp)}</td></tr>
    <tr style="font-weight:700"><td>= Custo landed total</td><td class="mono">${money(r.landed)}</td></tr></tbody></table>`;
  out.innerHTML=`<h3 style="font-size:16px;margin-bottom:12px">Resultado</h3>${tiles}
    <h4 style="font-size:14px;margin:18px 0 2px">Composição dos tributos</h4>${bars}
    <h4 style="font-size:14px;margin:18px 0 6px">Detalhamento</h4><div style="overflow-x:auto">${table}</div>`;
  applyGlossary(out);icons();

function drawGloss(grid){
  grid.innerHTML='';const q=glossQ.trim().toLowerCase();
  const list=GLOSSARY.filter(g=>!q||(g.t+' '+g.full+' '+g.def).toLowerCase().includes(q));

}

/* ============================ TOOLTIP DE GLOSSÁRIO ============================ */
const AUTO_KEYS=GLOSSARY.map(g=>g.t).filter(k=>/^[A-Za-zÀ-ÿ]{2,9}$/.test(k)).sort((a,b)=>b.length-a.length);
const GLOSS_RE=new RegExp('\\b('+AUTO_KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b');
const SKIP_TAGS={SCRIPT:1,STYLE:1,PRE:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1,BUTTON:1,A:1,I:1};
function applyGlossary(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    let p=n.parentNode;while(p&&p!==root){if(p.nodeType===1){if(SKIP_TAGS[p.tagName])return NodeFilter.FILTER_REJECT;if(p.classList&&(p.classList.contains('term')||p.classList.contains('no-gloss')))return NodeFilter.FILTER_REJECT;}p=p.parentNode;}
    return GLOSS_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const targets=[];let cur;while((cur=walker.nextNode()))targets.push(cur);
  const re=new RegExp(GLOSS_RE.source,'g');
  targets.forEach(node=>{const txt=node.nodeValue;re.lastIndex=0;let m,last=0;const frag=document.createDocumentFragment();let any=false;
    while((m=re.exec(txt))){frag.appendChild(document.createTextNode(txt.slice(last,m.index)));const span=document.createElement('span');span.className='term';span.dataset.t=m[1];span.textContent=m[1];span.setAttribute('tabindex','0');frag.appendChild(span);last=m.index+m[1].length;any=true;}
    if(any){frag.appendChild(document.createTextNode(txt.slice(last)));node.parentNode.replaceChild(frag,node);}});
}
const tipEl=$('#tip');let tipActive=null;
function showTip(span){const g=GMAP[span.dataset.t];if(!g)return;tipEl.innerHTML=`<b>${esc(g.t)} · ${esc(g.full)}</b>${esc(g.def)}`;tipEl.classList.add('show');
  const r=span.getBoundingClientRect();const tw=tipEl.offsetWidth,th=tipEl.offsetHeight;let x=r.left+r.width/2-tw/2;x=Math.max(8,Math.min(x,innerWidth-tw-8));let y=r.top-th-8;if(y<8)y=r.bottom+8;tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){tipEl.classList.remove('show');if(tipActive){tipActive.classList.remove('active');tipActive=null;}}
document.addEventListener('mouseover',e=>{const s=e.target.closest&&e.target.closest('.term');if(s)showTip(s);});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.term'))hideTip();});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('term'))showTip(e.target);});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('term'))hideTip();});
document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('.term');if(s){if(tipActive===s){hideTip();}else{hideTip();tipActive=s;s.classList.add('active');showTip(s);}}else if(tipActive){hideTip();}});
window.addEventListener('scroll',hideTip,true);
